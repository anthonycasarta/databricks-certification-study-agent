[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-certification-study-agent"
version = "0.1.0"
description = "A Databricks-native RAG study assistant for certifications."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "databricks-sdk",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
